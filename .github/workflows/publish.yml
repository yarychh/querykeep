name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        run: |
          version="$(node -p "require('./packages/querykeep/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Type-check
        run: bun run typecheck
        working-directory: packages/querykeep

      - name: Run tests
        run: bun test ./test
        working-directory: packages/querykeep

      - name: Build
        run: bun run build
        working-directory: packages/querykeep

      - name: Smoke-test with Node.js
        run: node verification/runtime-smoke.mjs
        working-directory: packages/querykeep

      - name: Smoke-test with Bun
        run: bun verification/runtime-smoke.mjs
        working-directory: packages/querykeep

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: packages/querykeep

      - name: Check registry
        id: registry
        run: |
          version="$(node -p "require('./packages/querykeep/package.json').version")"
          if npm view "querykeep@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "querykeep@$version is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        run: npm publish
        working-directory: packages/querykeep
