name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run --filter querykeep build

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Type-check source, examples, and tests
        run: bun run --filter querykeep typecheck

      - name: Run tests
        run: bun test ./test
        working-directory: packages/querykeep

      - name: Build docs
        run: bun run --filter docs build

      - name: Smoke-test with Node.js
        run: node verification/runtime-smoke.mjs
        working-directory: packages/querykeep

      - name: Smoke-test with Bun
        run: bun verification/runtime-smoke.mjs
        working-directory: packages/querykeep

      - name: Check browser-only types
        run: bunx tsc -p tsconfig.dom.json --pretty false --noEmit
        working-directory: packages/querykeep

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: packages/querykeep
