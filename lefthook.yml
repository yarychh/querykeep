# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  jobs:
    - name: prettier
      run: bun prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob:
        - "*.{js,mjs,cjs,ts,tsx}"
        - "**/*.{js,mjs,cjs,ts,tsx}"
      run: bun run lint:fix {staged_files}
      stage_fixed: true
